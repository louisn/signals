name: Backend CI

on:
  push:
    paths:
      - "backend/signals-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/signals-backend/**"
  workflow_call:

defaults:
  run:
    working-directory: backend/signals-backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/signals-backend/go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
