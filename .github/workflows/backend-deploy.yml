name: Backend Deploy

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "backend/signals-backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options: [dev, prod]

jobs:
  ci:
    uses: ./.github/workflows/backend-ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.environment
          || github.ref_name == 'main' && 'prod'
          || 'dev' }}
    concurrency: backend-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        working-directory: backend/signals-backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          ENV="${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}"
          flyctl deploy --config "deploy/fly.${ENV}.toml" --dockerfile deploy/Dockerfile --remote-only
